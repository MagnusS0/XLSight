name: Pack and Publish

on:
  push:
    tags:
      - 'v*'

env:
  CI: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # Required for OIDC token (NuGet trusted publishing)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore XLSight.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build XLSight.slnx --no-restore -c Release -m:1

      - name: Test
        run: dotnet test XLSight.slnx --no-build -c Release -m:1

      - name: Pack
        run: |
          dotnet pack src/XLSight/XLSight.csproj --no-build -c Release -o ./nupkg
          dotnet pack src/XLSight.Layout/XLSight.Layout.csproj --no-build -c Release -o ./nupkg
          dotnet pack src/XLSight.Query/XLSight.Query.csproj --no-build -c Release -o ./nupkg

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
